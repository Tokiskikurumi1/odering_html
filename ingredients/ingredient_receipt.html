<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản Lý Nguyên Liệu - Kurumi BBQ POS/ERP</title>
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Font Awesome 6.4.2 -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- CSS Stylings -->
    <link rel="stylesheet" href="../common.css" />
    <link rel="stylesheet" href="./ingredient_management.css" />
  </head>

  <body class="ingr-system-body-container">
    <div class="ingr-app-layout-wrapper">
      <!-- Sidebar -->
      <div id="ingr-sidebar-content">
        <!-- Sidebar content goes here -->
      </div>

      <!-- Main Content Area -->
      <div class="ingr-main-viewport-container">
        <!-- Header -->
        <div id="ingr-header-content">
          <!-- Header content goes here -->
        </div>

        <!-- Content Workspace -->
        <main
          class="ingr-main-workspace-scroller"
          id="ingr-workspace-content-pane"
        >
          <!-- 4. GOODS RECEIPT TAB -->
          <section class="ingr-tab-panel" id="ingr-panel-goods-receipt">
            <div class="ingr-transaction-form-split-grid">
              <!-- Receipt Creation Form -->
              <div class="ingr-transaction-card-panel">
                <h4 class="ingr-transaction-card-title">
                  <i class="fa-solid fa-circle-arrow-down"></i> Lập Phiếu Nhập
                  Kho
                </h4>
                <form
                  id="ingr-receipt-creation-form"
                  class="ingr-transaction-input-form"
                >
                  <div class="ingr-form-input-two-column-row">
                    <div class="ingr-form-field-group">
                      <label class="ingr-form-input-label"
                        >Nhà cung cấp
                        <span class="ingr-form-required-star">*</span></label
                      >
                      <select
                        class="ingr-form-dropdown-select"
                        id="ingr-receipt-supplier"
                        required
                      >
                        <option value="">-- Chọn nhà cung cấp --</option>
                        <!-- Dynamic suppliers -->
                      </select>
                    </div>
                    <div class="ingr-form-field-group">
                      <label class="ingr-form-input-label"
                        >Mã phiếu nhập (Tự động)</label
                      >
                      <input
                        type="text"
                        class="ingr-form-text-input"
                        id="ingr-receipt-code"
                        readonly
                        value="GR-20260525-001"
                      />
                    </div>
                  </div>

                  <div class="ingr-form-field-group">
                    <label class="ingr-form-input-label"
                      >Hóa đơn chứng từ (Đính kèm)</label
                    >
                    <div
                      class="ingr-invoice-upload-drag-drop-area"
                      id="ingr-receipt-upload-zone"
                    >
                      <i
                        class="fa-solid fa-cloud-arrow-up ingr-upload-area-icon"
                      ></i>
                      <p class="ingr-upload-area-primary-text">
                        Kéo thả hóa đơn điện tử vào đây hoặc click để tải lên
                      </p>
                      <p class="ingr-upload-area-secondary-text">
                        Hỗ trợ định dạng PDF, PNG, JPG (Max 5MB)
                      </p>
                      <input
                        type="file"
                        id="ingr-receipt-file-input"
                        style="display: none"
                        accept="image/*,application/pdf"
                      />
                      <div
                        class="ingr-uploaded-file-success-badge hidden"
                        id="ingr-receipt-file-badge"
                      >
                        <i class="fa-solid fa-file-invoice"></i>
                        <span id="ingr-receipt-filename">hoadon.pdf</span>
                        <button
                          type="button"
                          class="ingr-remove-uploaded-file-btn"
                          id="ingr-receipt-remove-file-btn"
                        >
                          <i class="fa-solid fa-xmark"></i>
                        </button>
                      </div>
                    </div>
                  </div>

                  <div class="ingr-receipt-selected-items-section">
                    <div class="ingr-receipt-items-header">
                      <h5>Danh sách nguyên liệu nhập</h5>
                      <button
                        type="button"
                        class="ingr-outline-add-btn"
                        id="ingr-receipt-add-item-row-btn"
                      >
                        <i class="fa-solid fa-plus"></i> Thêm dòng
                      </button>
                    </div>
                    <div class="ingr-receipt-items-table-scroller">
                      <table class="ingr-receipt-items-table">
                        <thead>
                          <tr>
                            <th>Nguyên liệu</th>
                            <th style="width: 100px">Tồn kho</th>
                            <th style="width: 120px">S.Lượng nhập</th>
                            <th style="width: 150px">Đơn giá (đ)</th>
                            <th style="width: 150px">Thành tiền</th>
                            <th style="width: 50px"></th>
                          </tr>
                        </thead>
                        <tbody id="ingr-receipt-items-tbody">
                          <!-- Dynamic invoice entries -->
                        </tbody>
                      </table>
                    </div>
                  </div>

                  <div class="ingr-receipt-total-financials-summary">
                    <div class="ingr-receipt-total-row">
                      <span>Tổng số mặt hàng:</span>
                      <strong id="ingr-receipt-summary-item-count">0</strong>
                    </div>
                    <div class="ingr-receipt-total-row big-price">
                      <span>TỔNG TIỀN THANH TOÁN:</span>
                      <strong id="ingr-receipt-summary-grand-total">0 đ</strong>
                    </div>
                  </div>

                  <div class="ingr-receipt-form-submit-row">
                    <button
                      type="button"
                      class="ingr-cancel-btn-action"
                      id="ingr-receipt-reset-form-btn"
                    >
                      Hủy & Nhập lại
                    </button>
                    <button type="submit" class="ingr-primary-btn-action">
                      <i class="fa-solid fa-circle-check"></i> Xác Nhận Nhập Kho
                    </button>
                  </div>
                </form>
              </div>
            </div>
          </section>
        </main>
      </div>
    </div>

    <!-- ==========================================
         MODALS SECTIONS
         ========================================== -->

    <!-- ==========================================
         TOAST NOTIFICATION PLACEMENT
         ========================================== -->
    <div class="ingr-toast-notification-dock" id="ingr-global-toast-container">
      <!-- Toast cards dynamically populated -->
    </div>

    <!-- Core Script -->
    <script src="./ingredient_sidebar.js"></script>
    <script src="./js/ingredient_receipt.js"></script>
  </body>
</html>
