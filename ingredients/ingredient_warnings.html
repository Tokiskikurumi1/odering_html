<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản Lý Nguyên Liệu - Kurumi BBQ POS/ERP</title>
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Font Awesome 6.4.2 -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- CSS Stylings -->
    <link rel="stylesheet" href="../common.css" />
    <link rel="stylesheet" href="./ingredient_management.css" />
  </head>

  <body class="ingr-system-body-container">
    <div class="ingr-app-layout-wrapper">
      <!-- Sidebar -->
      <div id="ingr-sidebar-content">
        <!-- Sidebar content goes here -->
      </div>

      <!-- Main Content Area -->
      <div class="ingr-main-viewport-container">
        <!-- Header -->
        <div id="ingr-header-content">
          <!-- Header content goes here -->
        </div>

        <!-- Content Workspace -->
        <main
          class="ingr-main-workspace-scroller"
          id="ingr-workspace-content-pane"
        >
          <!-- 7. WARNINGS TAB -->
          <section class="ingr-tab-panel" id="ingr-panel-warnings">
            <div class="ingr-panel-content-header-bar">
              <h4 class="ingr-tab-section-subtitle">
                Danh sách nguyên liệu gặp rủi ro vận hành kho
              </h4>
              <div class="ingr-warning-filters">
                <button class="ingr-warning-pill-filter active" data-type="all">
                  Tất cả cảnh báo
                </button>
                <button class="ingr-warning-pill-filter" data-type="critical">
                  Cần nhập gấp (Đỏ)
                </button>
                <button class="ingr-warning-pill-filter" data-type="warning">
                  Sắp hết (Vàng)
                </button>
                <button class="ingr-warning-pill-filter" data-type="expired">
                  Hết hạn (Đỏ thẫm)
                </button>
                <button class="ingr-warning-pill-filter" data-type="excess">
                  Tồn quá nhiều (Xanh)
                </button>
              </div>
            </div>

            <div class="ingr-table-scroll-container">
              <table class="ingr-ingredient-management-table">
                <thead>
                  <tr>
                    <th>Mã NL</th>
                    <th>Tên nguyên liệu</th>
                    <th>Phân loại rủi ro</th>
                    <th style="text-align: right">Số lượng hiện tại</th>
                    <th>Đơn vị</th>
                    <th>Ngưỡng cảnh báo</th>
                    <th>Hạn sử dụng</th>
                    <th style="text-align: center">Độ khẩn cấp</th>
                    <th style="text-align: center">Hành động</th>
                  </tr>
                </thead>
                <tbody id="ingr-warnings-table-body">
                  <!-- Dynamic warnings -->
                </tbody>
              </table>
            </div>
          </section>
        </main>
      </div>
    </div>

    <!-- ==========================================
         TOAST NOTIFICATION PLACEMENT
         ========================================== -->
    <div class="ingr-toast-notification-dock" id="ingr-global-toast-container">
      <!-- Toast cards dynamically populated -->
    </div>

    <!-- Core Script -->
    <script src="./ingredient_sidebar.js"></script>
    <script src="./ingredient_management.js"></script>
  </body>
</html>
