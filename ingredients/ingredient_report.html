<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản Lý Nguyên Liệu - Kurumi BBQ POS/ERP</title>
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Font Awesome 6.4.2 -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- CSS Stylings -->
    <link rel="stylesheet" href="../common.css" />
    <link rel="stylesheet" href="./ingredient_management.css" />
  </head>

  <body class="ingr-system-body-container">
    <div class="ingr-app-layout-wrapper">
      <!-- Sidebar -->
      <div id="ingr-sidebar-content">
        <!-- Sidebar content goes here -->
      </div>

      <!-- Main Content Area -->
      <div class="ingr-main-viewport-container">
        <!-- Header -->
        <div id="ingr-header-content">
          <!-- Header content goes here -->
        </div>

        <!-- Content Workspace -->
        <main
          class="ingr-main-workspace-scroller"
          id="ingr-workspace-content-pane"
        >
          <!-- 10. REPORTS & STATISTICS TAB -->
          <section class="ingr-tab-panel" id="ingr-panel-reports">
            <!-- Summary financial panels -->
            <div class="ingr-reports-mini-indicators-grid">
              <div class="ingr-report-stat-card">
                <span class="ingr-report-stat-card-title"
                  >Chi phí nhập kho tháng này</span
                >
                <h3
                  class="ingr-report-stat-card-value"
                  id="ingr-reports-total-cost"
                >
                  0 đ
                </h3>
                <p class="ingr-report-stat-card-subtitle">
                  <i class="fa-solid fa-circle-down" style="color: #ef4444"></i>
                  Chiếm 42% doanh số mua hàng
                </p>
              </div>
              <div class="ingr-report-stat-card">
                <span class="ingr-report-stat-card-title"
                  >Hao hụt/Hủy kho tháng này</span
                >
                <h3
                  class="ingr-report-stat-card-value"
                  id="ingr-reports-waste-cost"
                >
                  0 đ
                </h3>
                <p class="ingr-report-stat-card-subtitle">
                  <i class="fa-solid fa-circle-up" style="color: #10b981"></i>
                  Giảm 12% so với tháng trước
                </p>
              </div>
              <div class="ingr-report-stat-card">
                <span class="ingr-report-stat-card-title"
                  >Tổng số đơn nhập hàng</span
                >
                <h3
                  class="ingr-report-stat-card-value"
                  id="ingr-reports-total-orders"
                >
                  0 đơn
                </h3>
                <p class="ingr-report-stat-card-subtitle">
                  <i class="fa-solid fa-truck"></i> Giao hàng đúng hạn 98.4%
                </p>
              </div>
            </div>

            <div class="ingr-reports-charts-visual-grid">
              <!-- Spending chart -->
              <div class="ingr-report-chart-card-box">
                <h4 class="ingr-report-card-heading">
                  Biến động nhập xuất kho hàng tháng
                </h4>
                <div class="ingr-report-canvas-wrapper">
                  <canvas id="ingr-report-spend-chart"></canvas>
                </div>
              </div>

              <!-- Top used ingredient chart -->
              <div class="ingr-report-chart-card-box">
                <h4 class="ingr-report-card-heading">
                  Top 5 nguyên liệu sử dụng nhiều nhất (Tuần này)
                </h4>
                <div class="ingr-report-canvas-wrapper">
                  <canvas id="ingr-report-top-ingredients-chart"></canvas>
                </div>
              </div>
            </div>
          </section>
        </main>
      </div>
    </div>

    <!-- ==========================================
         MODALS SECTIONS
         ========================================== -->

    <!-- ==========================================
         TOAST NOTIFICATION PLACEMENT
         ========================================== -->
    <div class="ingr-toast-notification-dock" id="ingr-global-toast-container">
      <!-- Toast cards dynamically populated -->
    </div>

    <!-- Core Script -->
    <script src="./ingredient_sidebar.js"></script>
    <script src="./ingredient_management.js"></script>
  </body>
</html>
