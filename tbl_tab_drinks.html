<div class="tbl-tab-panel-inner">
  
  <!-- Filter & Action Bar -->
  <div class="tbl-filter-action-bar">
    <div class="tbl-bar-left-group">
      <!-- Search Input -->
      <div class="tbl-search-box-wrapper">
        <i class="fa-solid fa-magnifying-glass tbl-search-icon"></i>
        <input type="text" class="tbl-search-input" id="tbl-search-drinks" placeholder="Tìm đồ uống (trà sữa, bia...)" oninput="handleSearch('drinks')">
      </div>
    </div>
    
    <div class="tbl-bar-right-group">
      <!-- Category Filter Dropdown -->
      <div class="tbl-sort-select-wrapper">
        <i class="fa-solid fa-filter tbl-sort-icon"></i>
        <select class="tbl-sort-dropdown" id="tbl-filter-drinks" onchange="handleFilterChange('drinks')">
          <option value="all">Danh mục: Tất cả</option>
          <option value="milk-tea">Trà sữa</option>
          <option value="fruit-tea">Trà trái cây</option>
          <option value="soft-drink">Bia & Nước ngọt</option>
        </select>
      </div>

      <!-- Sort Selection -->
      <div class="tbl-sort-select-wrapper">
        <i class="fa-solid fa-arrow-down-wide-short tbl-sort-icon"></i>
        <select class="tbl-sort-dropdown" id="tbl-sort-drinks" onchange="handleSort('drinks')">
          <option value="default">Sắp xếp: Mặc định</option>
          <option value="price-asc">Giá: Thấp → Cao</option>
          <option value="price-desc">Giá: Cao → Thấp</option>
          <option value="name-asc">Tên: A → Z</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Food Cards Grid -->
  <div class="tbl-dishes-grid" id="tbl-grid-drinks">
    <!-- Grid elements loaded dynamically via JS -->
  </div>

  <!-- Pagination Controls -->
  <div class="tbl-pagination-wrapper" id="tbl-pagination-drinks" style="display: none;">
    <span class="tbl-pagination-info" id="tbl-pagination-info-drinks">Trang 1 / 1</span>
    <button type="button" class="tbl-pagination-btn" id="tbl-pagination-prev-drinks" onclick="changePage('drinks', -1)">
      <i class="fa-solid fa-chevron-left"></i>
    </button>
    <div id="tbl-pagination-numbers-drinks" style="display: flex; gap: 8px;">
      <!-- Page numbers will be inserted here -->
    </div>
    <button type="button" class="tbl-pagination-btn" id="tbl-pagination-next-drinks" onclick="changePage('drinks', 1)">
      <i class="fa-solid fa-chevron-right"></i>
    </button>
  </div>

</div>
